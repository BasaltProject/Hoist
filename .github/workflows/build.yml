name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
              .github/scripts/plan-version.sh release
          else
              .github/scripts/plan-version.sh ci
          fi
  linux:
    needs: plan
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-x64
          - os: ubuntu-24.04-arm
            target: Linux-arm64
    uses: ./.github/workflows/build-native.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      version: ${{ needs.plan.outputs.version }}

  windows:
    needs: plan
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: Windows-x64
    uses: ./.github/workflows/build-native.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      version: ${{ needs.plan.outputs.version }}

  macos:
    needs: plan
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macOS-x64
            arch: x86_64
          - os: macos-15
            target: macOS-arm64
    uses: ./.github/workflows/build-native.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      version: ${{ needs.plan.outputs.version }}

  musl:
    needs: plan
    name: Linux-musl-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build and test on Alpine
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          docker run --rm -e VERSION -e VCPKG_FORCE_SYSTEM_BINARIES=1 -v "$PWD:/src" -w /src alpine:3.23 sh -ec '
            apk add --no-cache cmake ninja-is-really-ninja clang lld gcc g++ musl-dev linux-headers file binutils bash curl git zip unzip tar pkgconf perl python3
            trap "cat build/release/_vcpkg/buildtrees/*/package-*-err.log build/release/_vcpkg/buildtrees/*/*-err.log 2>/dev/null | tail -60" EXIT
            cmake --preset release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DHOIST_WERROR=ON \
              -DHOIST_PLATFORM=Linux-musl -DHOIST_VERSION_OVERRIDE="$VERSION" \
              "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
            cmake --build build/release
            ctest --preset release
            for binary in build/release/bin/BasaltHoist-*; do
              file "$binary"
              if readelf -d "$binary" | grep NEEDED | grep -v "libc.musl"; then exit 1; fi
            done
          '

      - uses: actions/upload-artifact@v4
        with:
          name: basalt-hoist-Linux-musl-${{ matrix.arch }}
          path: build/release/bin/BasaltHoist-*
          if-no-files-found: error

  freebsd:
    needs: plan
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: FreeBSD-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build and test on FreeBSD
        uses: cross-platform-actions/action@v0.29.0
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        with:
          operating_system: freebsd
          version: '14.3'
          shell: bash
          environment_variables: VERSION
          run: |
            sudo pkg install -y cmake ninja llvm git curl zip unzip pkgconf perl5 python3 bash patchelf
            export VCPKG_FORCE_SYSTEM_BINARIES=1
            cmake --preset release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DHOIST_WERROR=ON \
              -DHOIST_VERSION_OVERRIDE="$VERSION"
            cmake --build build/release
            ctest --preset release

      - uses: actions/upload-artifact@v4
        with:
          name: basalt-hoist-${{ matrix.target }}
          path: build/release/bin/BasaltHoist-*
          if-no-files-found: error

  android:
    needs: plan
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android-arm64
            preset: android-arm64
            machine: AArch64
          - target: Android-x64
            preset: android-x64
            machine: Advanced Micro Devices X86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v4

      - name: Install the Android NDK
        run: |
          n=0
          until sdkmanager 'ndk;29.0.14206865'; do
            n=$((n + 1)); [ "$n" -lt 4 ] || exit 1; sleep $((n * 15))
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >>"$GITHUB_ENV"

      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake --preset "${{ matrix.preset }}" -DHOIST_WERROR=ON "-DHOIST_VERSION_OVERRIDE=$VERSION"
          cmake --build "build/${{ matrix.preset }}"

      - name: Check the executable
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          binary=(build/${{ matrix.preset }}/bin/BasaltHoist-*)
          readelf -h "${binary[0]}" | grep -F "$MACHINE"
          if readelf -d "${binary[0]}" | grep NEEDED | grep -E 'libc\+\+_shared|libstdc\+\+|libgcc_s'; then
              echo 'The executable needs a runtime Android does not ship'; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: basalt-hoist-${{ matrix.target }}
          path: build/${{ matrix.preset }}/bin/BasaltHoist-*
          if-no-files-found: error

  release:
    if: ${{ github.event_name == 'push' }}
    needs: [plan, linux, windows, macos, musl, freebsd, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: basalt-hoist-*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh "${{ needs.plan.outputs.version }}" "$GITHUB_SHA" artifacts
