name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_call:
    inputs:
      version:
        description: The version to stamp; empty builds a development version
        type: string
        default: ''
      ref:
        description: The commit to build
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: Linux-x64 }
          - { os: ubuntu-24.04-arm, target: Linux-arm64 }
          - { os: macos-15, target: macOS-arm64 }
          - { os: macos-15-intel, target: macOS-x64 }
          - { os: windows-2025, target: Windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.target }}

      - name: Install the toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang clang-format

      - name: Install the toolchain
        if: runner.os == 'macOS'
        run: brew install ninja llvm && echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Check the format
        if: runner.os == 'Linux' && matrix.target == 'Linux-x64'
        run: find hoist-* \( -name '*.hpp' -o -name '*.cpp' \) | xargs clang-format --dry-run --Werror

      - name: Lint
        if: runner.os == 'Linux' && matrix.target == 'Linux-x64'
        run: |
          sudo apt-get install -y clang-tidy
          cmake --preset debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          find hoist-* -name '*.cpp' -not -path '*/test/*' | xargs clang-tidy -p build/debug --quiet

      - name: Configure
        env:
          GITHUB_RUN_NUMBER: ${{ inputs.version && '' || github.run_number }}
        run: cmake --preset release -DHOIST_WERROR=ON ${{ inputs.version && format('-DHOIST_VERSION_OVERRIDE={0}', inputs.version) || '' }}

      - name: Build
        run: cmake --build build/release

      - name: Test
        run: ctest --preset release

      - uses: actions/upload-artifact@v4
        with:
          name: basalt-hoist-${{ matrix.target }}
          path: build/release/bin/BasaltHoist-*
          if-no-files-found: error

  musl:
    name: Linux-musl-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build and test on Alpine
        env:
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          docker run --rm -e VERSION -e RUN_NUMBER -e VCPKG_FORCE_SYSTEM_BINARIES=1 -v "$PWD:/src" -w /src alpine:3.23 sh -ec '
            apk add --no-cache cmake ninja clang lld gcc g++ musl-dev linux-headers file binutils bash curl git zip unzip tar pkgconf perl python3
            [ -n "$VERSION" ] || VERSION="26.3.0-ci$RUN_NUMBER"
            cmake --preset release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DHOIST_WERROR=ON \
              -DHOIST_PLATFORM=Linux-musl -DHOIST_VERSION_OVERRIDE="$VERSION" \
              "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
            cmake --build build/release
            ctest --preset release
            for binary in build/release/bin/BasaltHoist-*; do
              file "$binary"
              if readelf -d "$binary" | grep NEEDED | grep -v "libc.musl"; then exit 1; fi
            done
          '

      - uses: actions/upload-artifact@v4
        with:
          name: basalt-hoist-Linux-musl-${{ matrix.arch }}
          path: build/release/bin/BasaltHoist-*
          if-no-files-found: error

  freebsd:
    name: FreeBSD-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build and test on FreeBSD
        uses: cross-platform-actions/action@v0.29.0
        env:
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        with:
          operating_system: freebsd
          version: '14.3'
          shell: bash
          environment_variables: VERSION RUN_NUMBER
          run: |
            sudo pkg install -y cmake ninja llvm git curl zip unzip pkgconf perl5 python3 bash
            export VCPKG_FORCE_SYSTEM_BINARIES=1
            [ -n "$VERSION" ] || VERSION="26.3.0-ci$RUN_NUMBER"
            cmake --preset release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DHOIST_WERROR=ON \
              -DHOIST_VERSION_OVERRIDE="$VERSION"
            cmake --build build/release
            ctest --preset release

      - uses: actions/upload-artifact@v4
        with:
          name: basalt-hoist-FreeBSD-x64
          path: build/release/bin/BasaltHoist-*
          if-no-files-found: error

  android:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: Android-arm64, preset: android-arm64, machine: AArch64 }
          - { target: Android-x64, preset: android-x64, machine: Advanced Micro Devices X86-64 }
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: android-actions/setup-android@v4

      - name: Install the Android NDK
        run: |
          n=0
          until sdkmanager 'ndk;29.0.14206865'; do
            n=$((n + 1)); [ "$n" -lt 4 ] || exit 1; sleep $((n * 15))
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >>"$GITHUB_ENV"

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          [ -n "$VERSION" ] || VERSION="26.3.0-ci$RUN_NUMBER"
          cmake --preset "${{ matrix.preset }}" -DHOIST_WERROR=ON "-DHOIST_VERSION_OVERRIDE=$VERSION"
          cmake --build "build/${{ matrix.preset }}"

      - name: Check the executable
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          binary=(build/${{ matrix.preset }}/bin/BasaltHoist-*)
          readelf -h "${binary[0]}" | grep -F "$MACHINE"
          if readelf -d "${binary[0]}" | grep NEEDED | grep -E 'libc\+\+_shared|libstdc\+\+|libgcc_s'; then
              echo 'The executable needs a runtime Android does not ship'; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: basalt-hoist-${{ matrix.target }}
          path: build/${{ matrix.preset }}/bin/BasaltHoist-*
          if-no-files-found: error
